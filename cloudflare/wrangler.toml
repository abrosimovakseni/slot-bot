name = "slot-hse-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Plain (non-secret) config -- WORKER_URL is this Worker's own public URL,
# used only to re-assert the Telegram webhook registration once a day (see
# the "0 2 * * *" cron trigger below and index.ts's reassertWebhook()).
# ---------------------------------------------------------------------------
[vars]
WORKER_URL = "https://slot-hse-bot.slot-hse-abrosimova.workers.dev"

# ---------------------------------------------------------------------------
# D1 database
# ---------------------------------------------------------------------------
# `database_id` is filled in after `wrangler d1 create slot_bot_db` -- see
# README.md "Deployment" section for the one-time setup steps.
[[d1_databases]]
binding = "DB"
database_name = "slot_bot_db"
database_id = "cd2c9125-0e8d-4a0b-9906-ec77566cc3c6"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Queues -- used only for mass notification fan-out (opening broadcast,
# position-changed notices), so a slow/blocked recipient or a transient
# Telegram error can never affect anyone else, and so a broadcast to a
# course with 50+ students never risks the Workers Free plan's 50
# subrequests-per-invocation ceiling (see README.md "Why Queues").
# ---------------------------------------------------------------------------
[[queues.producers]]
queue = "slot-notify"
binding = "NOTIFY_QUEUE"

[[queues.consumers]]
queue = "slot-notify"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "slot-notify-dlq"

# ---------------------------------------------------------------------------
# Durable Objects -- one instance per admin one-off consultation, used only
# to fire a precise setAlarm() at that consultation's exact
# registration_opens_at instant (see src/consultationOpener.ts's doc
# comment for the full why). SQLite-backed Durable Objects are included in
# the Workers Free plan, same as everything else here.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "CONSULTATION_OPENER"
class_name = "ConsultationOpener"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConsultationOpener"]

# ---------------------------------------------------------------------------
# Cron Triggers -- all in UTC (Cloudflare Cron Triggers do not support named
# timezones). Europe/Moscow is UTC+3 year-round (Russia has not observed DST
# since 2014), so the offset is fixed and never needs seasonal adjustment.
#
#   "* * * * *"   the ONLY driver of the recurring weekly schedule, every
#                 minute, every day -- reconcile() (src/db/consultations.ts)
#                 reads the current weekly slots from D1 (src/db/schedule.ts)
#                 and creates/opens whichever one is due "this minute", and
#                 also finalizes past-due consultations. There used to be a
#                 separate precise cron entry per weekday here (one per
#                 schedule entry) -- that's gone now that the schedule
#                 itself lives in D1 and is editable by the bot's own admin
#                 (see bot/handlers/admin.ts's "📅 Еженедельный график"):
#                 wrangler.toml can no longer know in advance which weekdays
#                 matter, so this once-a-minute tick is now both the
#                 creator AND the safety net, at the cost of at most a
#                 1-minute delay versus the old to-the-second precision
#                 (irrelevant for a weekly class time). The
#                 ConsultationOpener Durable Object (see consultationOpener.ts)
#                 still gives an admin ONE-OFF consultation its own
#                 to-the-second opening, independent of this tick. Each tick
#                 is a handful of small, cheap D1 reads (a no-op unless
#                 something's actually due), well within the free tier at
#                 1,440 invocations/day.
#   "*/15 * * * *" webhook self-heal, every 15 minutes -- re-asserts the
#                 Telegram webhook registration (index.ts's
#                 reassertWebhook()) using the CURRENT WEBHOOK_SECRET,
#                 whether or not anything looks wrong. This is a completely
#                 separate concern from the trigger above: it never touches
#                 D1, the notify queue, or any student-facing flow, only
#                 Telegram's own webhook config -- so it can never delay or
#                 interfere with a student signing up or getting notified.
#                 Originally once a day (quiet hours, 02:00 UTC): tightened
#                 to every 15 minutes after the registration was observed
#                 dropping more than once in a single day -- Telegram
#                 resets both url AND allowed_updates to its own defaults
#                 when this happens, which is not what a simple wrong-secret
#                 403 looks like, and Telegram's docs don't specify the
#                 exact failure threshold that triggers it. Rather than
#                 chase that undocumented threshold, this just bounds how
#                 long the registration can stay broken to 15 minutes
#                 instead of a day.
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/15 * * * *", "* * * * *"]

[observability]
enabled = true
