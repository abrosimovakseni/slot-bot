name = "slot-hse-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 database
# ---------------------------------------------------------------------------
# `database_id` is filled in after `wrangler d1 create slot_bot_db` -- see
# README.md "Deployment" section for the one-time setup steps.
[[d1_databases]]
binding = "DB"
database_name = "slot_bot_db"
database_id = "cd2c9125-0e8d-4a0b-9906-ec77566cc3c6"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Queues -- used only for mass notification fan-out (opening broadcast,
# position-changed notices), so a slow/blocked recipient or a transient
# Telegram error can never affect anyone else, and so a broadcast to a
# course with 50+ students never risks the Workers Free plan's 50
# subrequests-per-invocation ceiling (see README.md "Why Queues").
# ---------------------------------------------------------------------------
[[queues.producers]]
queue = "slot-notify"
binding = "NOTIFY_QUEUE"

[[queues.consumers]]
queue = "slot-notify"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "slot-notify-dlq"

# ---------------------------------------------------------------------------
# Durable Objects -- one instance per admin one-off consultation, used only
# to fire a precise setAlarm() at that consultation's exact
# registration_opens_at instant (see src/consultationOpener.ts's doc
# comment for the full why). SQLite-backed Durable Objects are included in
# the Workers Free plan, same as everything else here.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "CONSULTATION_OPENER"
class_name = "ConsultationOpener"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConsultationOpener"]

# ---------------------------------------------------------------------------
# Cron Triggers -- all in UTC (Cloudflare Cron Triggers do not support named
# timezones). Europe/Moscow is UTC+3 year-round (Russia has not observed DST
# since 2014), so the offset is fixed and never needs seasonal adjustment.
#
#   "30 6 * * 3"  Wednesday 09:30 Europe/Moscow (06:30 UTC) -- prompt open
#   "30 6 * * 5"  Friday    09:30 Europe/Moscow (06:30 UTC) -- prompt open
#   "30 6 * * 6"  Saturday  09:30 Europe/Moscow (06:30 UTC) -- prompt open
#                 (curator Боремир Иванович, room 324 -- see WEEKLY_SCHEDULE
#                 in src/config.ts; everything else about this trigger works
#                 exactly like the Wed/Fri ones above)
#   "* * * * *"   safety-net reconcile, every minute, every day -- finalizes
#                 past-due consultations, and is the BACKUP path for opening
#                 (the ConsultationOpener Durable Object above is the
#                 primary path for an admin one-off consultation's exact
#                 opening moment; this sweep only ends up doing the work if
#                 that alarm is ever missed). Also still the only path for
#                 catching up a deploy mid-window or a transient error on
#                 the three precise triggers above, using the exact same
#                 idempotent reconcile() logic either way. Each tick is a
#                 handful of small, cheap D1 reads (a no-op unless
#                 something's actually due), well within the free tier at
#                 1,440 invocations/day.
# ---------------------------------------------------------------------------
[triggers]
crons = ["30 6 * * 3", "30 6 * * 5", "30 6 * * 6", "* * * * *"]

[observability]
enabled = true
